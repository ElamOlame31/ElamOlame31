<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Scanning candidate directions">
  <title>What's next</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/><stop offset="45%" stop-color="#0b1226"/><stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="1200" height="150" rx="6"/></clipPath>
  </defs>

  <style>
    .peak { fill:none; stroke-width:2.4; opacity:.16; animation:lit 7s linear infinite; }
    @keyframes lit { 0% {opacity:.16} 3% {opacity:1} 13% {opacity:.16} 100% {opacity:.16} }
    .sweep { animation:sw 7s linear infinite; }
    @keyframes sw { 0% { transform:translateX(-140px);} 100% { transform:translateX(1240px);} }
    .q { opacity:.25; animation:q 7s linear infinite; }
    @keyframes q { 0% {opacity:.25} 3% {opacity:1} 20% {opacity:.25} 100% {opacity:.25} }
    .mono { font-family:"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace; }
  </style>

  <g clip-path="url(#c)">
    <rect width="1200" height="150" fill="url(#bg)"/>

    <g stroke="#22d3ee" stroke-width="1" opacity=".10">
      <path d="M0 40 H1200 M0 70 H1200 M0 100 H1200"/>
      <path d="M200 0 V150 M400 0 V150 M600 0 V150 M800 0 V150 M1000 0 V150"/>
    </g>
    <path d="M0 124 H1200" stroke="#334155" stroke-width="1.2"/>

    <g filter="url(#gl)">
      <path class="peak" stroke="#22d3ee" style="animation-delay:.58s"  d="M95 124 Q150 62 205 124"/>
      <path class="peak" stroke="#38bdf8" style="animation-delay:1.57s" d="M265 124 Q320 88 375 124"/>
      <path class="peak" stroke="#818cf8" style="animation-delay:2.56s" d="M435 124 Q490 44 545 124"/>
      <path class="peak" stroke="#a78bfa" style="animation-delay:3.55s" d="M605 124 Q660 96 715 124"/>
      <path class="peak" stroke="#c084fc" style="animation-delay:4.54s" d="M775 124 Q830 70 885 124"/>
      <path class="peak" stroke="#f472b6" style="animation-delay:5.53s" d="M945 124 Q1000 54 1055 124"/>
    </g>

    <g class="mono" font-size="17" fill="#e2e8f0" text-anchor="middle">
      <text class="q" x="490"  y="36" style="animation-delay:2.56s">?</text>
      <text class="q" x="1000" y="46" style="animation-delay:5.53s">?</text>
      <text class="q" x="150"  y="54" style="animation-delay:.58s">?</text>
    </g>

    <rect class="sweep" x="0" y="0" width="120" height="150" fill="url(#beam)"/>
    <g class="sweep"><rect x="58" y="0" width="1.6" height="150" fill="#22d3ee" opacity=".8" filter="url(#gl)"/></g>

    <text class="mono" x="24" y="26" font-size="11" fill="#475569" letter-spacing="3">EVALUATING OPTIONS</text>
    <rect width="1200" height="150" rx="6" fill="none" stroke="#334155" stroke-opacity=".55"/>
  </g>
</svg>
