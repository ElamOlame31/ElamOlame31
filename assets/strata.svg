<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Buried work being dug back up">
  <title>The back catalogue</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/><stop offset="45%" stop-color="#0b1226"/><stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="4.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="1200" height="150" rx="6"/></clipPath>
  </defs>

  <style>
    .relic { animation:unearth 10s ease-in-out infinite; transform-origin:center; }
    @keyframes unearth { 0%,100% { opacity:.14; } 12% { opacity:1; } 26% { opacity:.14; } }
    .sweep { animation:sw 10s linear infinite; }
    @keyframes sw { 0% { transform:translateX(-300px); } 100% { transform:translateX(1240px); } }
    .dust { animation:up 7s ease-in-out infinite; }
    @keyframes up {
      0%   { transform:translate(0,0); opacity:0; }
      35%  { opacity:.65; }
      100% { transform:translate(10px,-30px); opacity:0; }
    }
    .mono { font-family:"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace; }
  </style>

  <g clip-path="url(#c)">
    <rect width="1200" height="150" fill="url(#bg)"/>

    <!-- sediment: same navy family, each layer a shade deeper -->
    <path d="M0 32 Q300 22 600 32 T1200 30 L1200 58 L0 60 Z"   fill="#0e1730" opacity=".9"/>
    <path d="M0 60 Q300 52 600 60 T1200 58 L1200 88 L0 90 Z"   fill="#141d3d" opacity=".9"/>
    <path d="M0 90 Q300 82 600 90 T1200 88 L1200 118 L0 120 Z" fill="#1a1743" opacity=".9"/>
    <path d="M0 120 Q300 112 600 120 T1200 118 L1200 150 L0 150 Z" fill="#211048" opacity=".9"/>

    <!-- layer boundaries -->
    <g fill="none" stroke="#22d3ee" stroke-width="1" opacity=".18">
      <path d="M0 32 Q300 22 600 32 T1200 30"/>
      <path d="M0 60 Q300 52 600 60 T1200 58"/>
      <path d="M0 90 Q300 82 600 90 T1200 88"/>
      <path d="M0 120 Q300 112 600 120 T1200 118"/>
    </g>

    <!-- grain -->
    <g stroke="#818cf8" stroke-width="1" opacity=".13">
      <path d="M40 46 h60 M180 48 h90 M420 44 h70 M700 47 h110 M960 45 h80"/>
      <path d="M90 75 h120 M330 73 h60 M560 76 h140 M860 74 h90 M1080 75 h70"/>
      <path d="M60 105 h100 M280 103 h130 M600 106 h80 M820 104 h60 M1020 105 h120"/>
      <path d="M120 135 h90 M400 133 h110 M740 136 h70 M980 134 h130"/>
    </g>

    <!-- finds, lighting up one after another along the accent ramp -->
    <g filter="url(#gl)">
      <circle class="relic" cx="150"  cy="46"  r="5.5" fill="#22d3ee" style="animation-delay:0s"/>
      <rect   class="relic" x="330"   y="69"  width="12" height="12" rx="2.5" fill="#38bdf8" transform="rotate(18 336 75)" style="animation-delay:1.6s"/>
      <circle class="relic" cx="560"  cy="101" r="6"   fill="#818cf8" style="animation-delay:3.2s"/>
      <rect   class="relic" x="760"   y="67"  width="11" height="11" rx="2.5" fill="#a78bfa" transform="rotate(-12 765 72)" style="animation-delay:4.8s"/>
      <circle class="relic" cx="940"  cy="130" r="5.5" fill="#c084fc" style="animation-delay:6.4s"/>
      <rect   class="relic" x="1080"  y="98"  width="12" height="12" rx="2.5" fill="#f472b6" transform="rotate(24 1086 104)" style="animation-delay:8s"/>
    </g>

    <!-- dust kicked up -->
    <g fill="#a5b4fc">
      <circle class="dust" cx="210"  cy="122" r="1.9" style="animation-delay:0s"/>
      <circle class="dust" cx="520"  cy="134" r="1.5" style="animation-delay:1.4s"/>
      <circle class="dust" cx="800"  cy="128" r="2.1" style="animation-delay:2.8s"/>
      <circle class="dust" cx="1010" cy="136" r="1.7" style="animation-delay:4.2s"/>
    </g>

    <rect class="sweep" x="0" y="0" width="240" height="150" fill="url(#beam)"/>

    <text class="mono" x="24" y="20" font-size="11" fill="#475569" letter-spacing="3">STILL DIGGING</text>
    <rect width="1200" height="150" rx="6" fill="none" stroke="#334155" stroke-opacity=".55"/>
  </g>
</svg>
