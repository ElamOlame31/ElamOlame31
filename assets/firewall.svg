<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Packets meeting an allow-list barrier">
  <title>When the network is the adversary</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/><stop offset="45%" stop-color="#0b1226"/><stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity=".55"/>
    </linearGradient>
    <filter id="gl" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="1200" height="150" rx="6"/></clipPath>
  </defs>

  <style>
    .blocked { animation:blocked 5s ease-in infinite; }
    @keyframes blocked {
      0%   { transform:translateX(0);    opacity:0; }
      12%  { opacity:1; }
      68%  { transform:translateX(560px); opacity:1; }
      78%  { transform:translateX(578px); opacity:1; }
      100% { transform:translateX(578px); opacity:0; }
    }
    .through { animation:through 5s linear infinite; }
    @keyframes through {
      0%   { transform:translateX(0);    opacity:0; }
      10%  { opacity:1; }
      92%  { opacity:1; }
      100% { transform:translateX(1120px); opacity:0; }
    }
    .shimmer { animation:sh 3.2s ease-in-out infinite; }
    @keyframes sh { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    .spark { animation:spark 5s ease-out infinite; transform-origin:center; }
    @keyframes spark { 0%,66% { opacity:0; transform:scale(.4);} 74% { opacity:.9; transform:scale(1.7);} 86%,100% { opacity:0; transform:scale(2.1);} }
    .mono { font-family:"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace; }
  </style>

  <g clip-path="url(#c)">
    <rect width="1200" height="150" fill="url(#bg)"/>

    <g stroke="#22d3ee" stroke-width="1" opacity=".09">
      <path d="M0 38 H1200 M0 75 H1200 M0 112 H1200"/>
    </g>

    <!-- the allow-list barrier -->
    <g class="shimmer">
      <rect x="596" y="8" width="10" height="134" rx="3" fill="url(#wall)" filter="url(#gl)"/>
      <g fill="#f472b6" opacity=".5">
        <rect x="592" y="14" width="18" height="10" rx="2"/><rect x="592" y="40" width="18" height="10" rx="2"/>
        <rect x="592" y="66" width="18" height="10" rx="2"/><rect x="592" y="92" width="18" height="10" rx="2"/>
        <rect x="592" y="118" width="18" height="10" rx="2"/>
      </g>
    </g>

    <!-- packets that die at the wall -->
    <g fill="#f472b6" filter="url(#gl)">
      <rect class="blocked" x="20" y="33"  width="11" height="8" rx="2" style="animation-delay:0s"/>
      <rect class="blocked" x="20" y="70"  width="11" height="8" rx="2" style="animation-delay:1.1s"/>
      <rect class="blocked" x="20" y="107" width="11" height="8" rx="2" style="animation-delay:2.3s"/>
      <rect class="blocked" x="20" y="52"  width="11" height="8" rx="2" style="animation-delay:3.4s"/>
      <rect class="blocked" x="20" y="126" width="11" height="8" rx="2" style="animation-delay:4.1s"/>
    </g>
    <g fill="#f9a8d4" filter="url(#gl)">
      <circle class="spark" cx="604" cy="37"  r="4" style="animation-delay:0s"/>
      <circle class="spark" cx="604" cy="74"  r="4" style="animation-delay:1.1s"/>
      <circle class="spark" cx="604" cy="111" r="4" style="animation-delay:2.3s"/>
      <circle class="spark" cx="604" cy="56"  r="4" style="animation-delay:3.4s"/>
      <circle class="spark" cx="604" cy="130" r="4" style="animation-delay:4.1s"/>
    </g>

    <!-- the ones that make it -->
    <g fill="#22d3ee" filter="url(#gl)">
      <rect class="through" x="20" y="19" width="11" height="8" rx="2" style="animation-delay:.6s"/>
      <rect class="through" x="20" y="88" width="11" height="8" rx="2" style="animation-delay:2.9s"/>
    </g>

    <text class="mono" x="24"   y="26"  font-size="11" fill="#475569" letter-spacing="3">SENT</text>
    <text class="mono" x="1176" y="26"  font-size="11" fill="#475569" letter-spacing="3" text-anchor="end">OBSERVED</text>
    <text class="mono" x="601"  y="146" font-size="10" fill="#64748b" letter-spacing="2" text-anchor="middle">ALLOW-LIST</text>

    <rect width="1200" height="150" rx="6" fill="none" stroke="#334155" stroke-opacity=".55"/>
  </g>
</svg>
