<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Redacted document — work under NDA">
  <title>Under NDA</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/><stop offset="45%" stop-color="#0b1226"/><stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <filter id="gl" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="1200" height="150" rx="6"/></clipPath>
  </defs>

  <style>
    .stamp{ animation:stampIn 9s ease-out infinite; transform-origin:1035px 75px; }
    @keyframes stampIn {
      0%,52%  { opacity:0; transform:scale(1.9) rotate(-14deg); }
      60%,92% { opacity:.95; transform:scale(1) rotate(-14deg); }
      100%    { opacity:0;  transform:scale(1) rotate(-14deg); }
    }
    .lock { animation:lockPulse 9s ease-in-out infinite; }
    @keyframes lockPulse { 0%,45%,100% { opacity:.30; } 65% { opacity:.95; } }
    .mono { font-family:"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace; }
  </style>

  <g clip-path="url(#c)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <g stroke="#22d3ee" stroke-width="1" opacity=".08">
      <path d="M0 41 H1200 M0 67 H1200 M0 93 H1200 M0 119 H1200"/>
    </g>
    <rect x="0" y="0" width="5" height="150" fill="#f472b6" opacity=".55"/>

    <!-- the text you are not going to read -->
    <g fill="#334155">
      <rect x="48"  y="28"  width="150" height="9" rx="4.5"/>
      <rect x="210" y="28"  width="280" height="9" rx="4.5"/>
      <rect x="502" y="28"  width="190" height="9" rx="4.5"/>
      <rect x="704" y="28"  width="120" height="9" rx="4.5"/>
      <rect x="48"  y="54"  width="240" height="9" rx="4.5"/>
      <rect x="300" y="54"  width="130" height="9" rx="4.5"/>
      <rect x="442" y="54"  width="330" height="9" rx="4.5"/>
      <rect x="48"  y="80"  width="110" height="9" rx="4.5"/>
      <rect x="170" y="80"  width="300" height="9" rx="4.5"/>
      <rect x="482" y="80"  width="210" height="9" rx="4.5"/>
      <rect x="704" y="80"  width="160" height="9" rx="4.5"/>
      <rect x="48"  y="106" width="270" height="9" rx="4.5"/>
      <rect x="330" y="106" width="180" height="9" rx="4.5"/>
      <rect x="522" y="106" width="240" height="9" rx="4.5"/>
    </g>

    <!-- redaction sweeps in, line by line -->
    <g fill="#020408">
      <rect x="204" y="24" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;292;292;0" keyTimes="0;0.16;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="438" y="50" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;0;340;340;0" keyTimes="0;0.14;0.30;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="166" y="76" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;0;310;310;0" keyTimes="0;0.28;0.44;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="478" y="76" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.36;0.50;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="518" y="102" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;0;250;250;0" keyTimes="0;0.44;0.60;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="44"  y="102" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;0;280;280;0" keyTimes="0;0.52;0.68;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
    </g>
    <!-- cyan leading edge on each bar -->
    <g fill="#22d3ee" opacity=".9" filter="url(#gl)">
      <rect x="204" y="24" width="2" height="17">
        <animate attributeName="x" values="204;496;496;204" keyTimes="0;0.16;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="438" y="50" width="2" height="17">
        <animate attributeName="x" values="438;438;778;778;438" keyTimes="0;0.14;0.30;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="166" y="76" width="2" height="17">
        <animate attributeName="x" values="166;166;476;476;166" keyTimes="0;0.28;0.44;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="44" y="102" width="2" height="17">
        <animate attributeName="x" values="44;44;324;324;44" keyTimes="0;0.52;0.68;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
    </g>

    <!-- padlock -->
    <g class="lock" transform="translate(915,58)" fill="none" stroke="#94a3b8" stroke-width="3.4" filter="url(#gl)">
      <path d="M7 16 V10 a9 9 0 0 1 18 0 v6"/>
      <rect x="0" y="16" width="32" height="24" rx="4" fill="#94a3b8" stroke="none"/>
    </g>

    <!-- stamp -->
    <g class="stamp" filter="url(#gl)">
      <rect x="952" y="50" width="166" height="50" rx="5" fill="none" stroke="#f472b6" stroke-width="3.5"/>
      <text x="1035" y="83" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
            font-size="25" font-weight="bold" fill="#f472b6" letter-spacing="2.5">UNDER NDA</text>
    </g>

    <text class="mono" x="24" y="20" font-size="11" fill="#475569" letter-spacing="3">CLASSIFIED</text>
    <rect width="1200" height="150" rx="6" fill="none" stroke="#334155" stroke-opacity=".55"/>
  </g>
</svg>
