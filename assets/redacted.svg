<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Redacted document — work under NDA">
  <title>Under NDA</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf8f1"/>
      <stop offset="100%" stop-color="#efe9dc"/>
    </linearGradient>
    <filter id="inkblur" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <clipPath id="pageClip"><rect width="1200" height="150" rx="6"/></clipPath>
  </defs>

  <style>
    .txt  { fill:#b9b0a0; }
    .bar  { fill:#14110d; }
    .stamp{ animation:stampIn 9s ease-out infinite; transform-origin:1035px 75px; }
    @keyframes stampIn {
      0%,52%  { opacity:0; transform:scale(1.9) rotate(-14deg); }
      60%     { opacity:.95; transform:scale(1) rotate(-14deg); }
      92%     { opacity:.95; transform:scale(1) rotate(-14deg); }
      100%    { opacity:0;  transform:scale(1) rotate(-14deg); }
    }
    .clip { animation:clipPulse 9s ease-in-out infinite; }
    @keyframes clipPulse { 0%,45%,100% { opacity:.30; } 65% { opacity:.9; } }
  </style>

  <g clip-path="url(#pageClip)">
    <rect width="1200" height="150" fill="url(#paper)"/>
    <rect x="0" y="0" width="7" height="150" fill="#c9422f" opacity=".75"/>

    <!-- body text, progressively swallowed by redaction -->
    <g class="txt" filter="url(#inkblur)">
      <rect x="48"  y="28"  width="150" height="9" rx="4.5"/>
      <rect x="210" y="28"  width="280" height="9" rx="4.5"/>
      <rect x="502" y="28"  width="190" height="9" rx="4.5"/>
      <rect x="704" y="28"  width="120" height="9" rx="4.5"/>

      <rect x="48"  y="54"  width="240" height="9" rx="4.5"/>
      <rect x="300" y="54"  width="130" height="9" rx="4.5"/>
      <rect x="442" y="54"  width="330" height="9" rx="4.5"/>

      <rect x="48"  y="80"  width="110" height="9" rx="4.5"/>
      <rect x="170" y="80"  width="300" height="9" rx="4.5"/>
      <rect x="482" y="80"  width="210" height="9" rx="4.5"/>
      <rect x="704" y="80"  width="160" height="9" rx="4.5"/>

      <rect x="48"  y="106" width="270" height="9" rx="4.5"/>
      <rect x="330" y="106" width="180" height="9" rx="4.5"/>
      <rect x="522" y="106" width="240" height="9" rx="4.5"/>
    </g>

    <!-- redaction bars sweep in, one after another, then reset -->
    <g class="bar">
      <rect x="204" y="24" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;292;292;0" keyTimes="0;0.16;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="438" y="50" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;0;340;340;0" keyTimes="0;0.14;0.30;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="166" y="76" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;0;310;310;0" keyTimes="0;0.28;0.44;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="478" y="76" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.36;0.50;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="518" y="102" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;0;250;250;0" keyTimes="0;0.44;0.60;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="44"  y="102" height="17" rx="2" width="0">
        <animate attributeName="width" values="0;0;280;280;0" keyTimes="0;0.52;0.68;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- padlock -->
    <g class="clip" transform="translate(915,58)" fill="none" stroke="#6b6355" stroke-width="3.4">
      <path d="M7 16 V10 a9 9 0 0 1 18 0 v6"/>
      <rect x="0" y="16" width="32" height="24" rx="4" fill="#6b6355" stroke="none"/>
    </g>

    <!-- stamp -->
    <g class="stamp">
      <rect x="952" y="50" width="166" height="50" rx="5" fill="none" stroke="#c9422f" stroke-width="3.5"/>
      <text x="1035" y="83" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
            font-size="25" font-weight="bold" fill="#c9422f" letter-spacing="2.5">UNDER NDA</text>
    </g>
  </g>
</svg>
